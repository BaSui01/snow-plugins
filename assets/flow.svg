<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 232" width="960" height="232" role="img" aria-label="Snow App 宿主、插件与模型工具之间的调用关系">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1224"/>
      <stop offset="1" stop-color="#101d38"/>
    </linearGradient>
    <linearGradient id="lineFwd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="lineBack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0.25"/>
    </linearGradient>
    <marker id="arrowFwd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowBack" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#a78bfa"/>
    </marker>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g>
      <rect x="56" y="64" width="220" height="104" rx="14" fill="url(#card)" stroke="#274060"/>
      <rect x="56" y="64" width="220" height="3" rx="1.5" fill="#38bdf8" fill-opacity="0.65"/>
      <text x="80" y="104" font-size="17" font-weight="600" fill="#e6f5ff">Snow App 宿主</text>
      <text x="80" y="130" font-size="12.5" fill="#93a9c6">面板 · 工具槽 · 权限</text>
      <text x="80" y="150" font-size="12.5" fill="#93a9c6">元数据 · 隐私声明</text>
    </g>

    <g>
      <rect x="370" y="64" width="220" height="104" rx="14" fill="url(#card)" stroke="#3b3560"/>
      <rect x="370" y="64" width="220" height="3" rx="1.5" fill="#a78bfa" fill-opacity="0.65"/>
      <text x="394" y="104" font-size="17" font-weight="600" fill="#e6f5ff">plugins/</text>
      <text x="394" y="130" font-size="12.5" fill="#93a9c6">ESM 面板 · MCP 服务</text>
      <text x="394" y="150" font-size="12.5" fill="#93a9c6">工具卡 · 技能 · 词条</text>
    </g>

    <g>
      <rect x="684" y="64" width="220" height="104" rx="14" fill="url(#card)" stroke="#1f4d44"/>
      <rect x="684" y="64" width="220" height="3" rx="1.5" fill="#34d399" fill-opacity="0.65"/>
      <text x="708" y="104" font-size="17" font-weight="600" fill="#e6f5ff">模型与工具</text>
      <text x="708" y="130" font-size="12.5" fill="#93a9c6">调用 · 结果卡片</text>
      <text x="708" y="150" font-size="12.5" fill="#93a9c6">本地命令 · 远端 API</text>
    </g>

    <g>
      <path d="M282 108 H362" fill="none" stroke="url(#lineFwd)" stroke-width="2" marker-end="url(#arrowFwd)"/>
      <path d="M596 108 H676" fill="none" stroke="url(#lineFwd)" stroke-width="2" marker-end="url(#arrowFwd)"/>
      <path d="M676 136 H596" fill="none" stroke="url(#lineBack)" stroke-width="2" marker-end="url(#arrowBack)"/>
      <path d="M362 136 H282" fill="none" stroke="url(#lineBack)" stroke-width="2" marker-end="url(#arrowBack)"/>

      <circle r="3.6" fill="#7dd3fc" filter="url(#soft)">
        <animateMotion path="M290 108 H356" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.6" fill="#7dd3fc" filter="url(#soft)">
        <animateMotion path="M604 108 H670" dur="2.4s" begin="0.7s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#c4b5fd" filter="url(#soft)">
        <animateMotion path="M670 136 H604" dur="2.8s" begin="0.3s" repeatCount="indefinite"/>
      </circle>
      <circle r="3.4" fill="#c4b5fd" filter="url(#soft)">
        <animateMotion path="M356 136 H290" dur="2.8s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <text x="56" y="206" font-size="12.5" fill="#7f93b0">宿主能力由 Snow App 提供；每个插件独立版本、安装包与 Release，互不要求同步升级。</text>
  </g>
</svg>
