    <text x="62" y="158" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="url(#title)" letter-spacing="0.5">Snow Plugins</text>
    <text x="65" y="196" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="17" fill="#b8c8de">独立插件 · 各自安装 · 各自发版 · 全部开源</text>

    <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="13.5" fill="#dbeafe">
      <g transform="translate(64 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#38bdf8" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#38bdf8"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">提示词优化</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#7dd3fc" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="0s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(228 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#a78bfa" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#a78bfa"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="1s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">GitHub</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#c4b5fd" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="1s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(392 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#34d399" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#34d399"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="2s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">Docker</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#6ee7b7" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="2s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(556 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#fbbf24" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#fbbf24"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="3s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">FFmpeg</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#fcd34d" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="3s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(720 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#f472b6" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#f472b6"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="4s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">工具画廊</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#f9a8d4" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="4s" repeatCount="indefinite"/></rect>
      </g>
      <g transform="translate(884 228)">
        <rect width="152" height="36" rx="18" fill="#101c33" stroke="#22d3ee" stroke-opacity="0.35"/>
        <circle cx="20" cy="18" r="4" fill="#22d3ee"><animate attributeName="fill-opacity" values="0.35;1;0.35" dur="6s" begin="5s" repeatCount="indefinite"/></circle>
        <text x="36" y="23">文件统计</text>
        <rect width="152" height="36" rx="18" fill="none" stroke="#67e8f9" stroke-width="1.4" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.55;0" dur="6s" begin="5s" repeatCount="indefinite"/></rect>
