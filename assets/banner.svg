    <g>
      <rect x="64" y="292" width="1072" height="2" rx="1" fill="#ffffff" fill-opacity="0.06"/>
      <rect x="64" y="292" width="240" height="2" rx="1" fill="url(#pulse)" fill-opacity="0.9">
        <animate attributeName="x" values="64;896;64" dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="1136" y="86" text-anchor="end" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" fill="#8fa6c4" letter-spacing="1.2">6 PLUGINS · MIT</text>
    <rect x="0.6" y="0.6" width="1198.8" height="318.8" rx="17.4" fill="none" stroke="#7dd3fc" stroke-opacity="0.14"/>
  </g>
</svg>
