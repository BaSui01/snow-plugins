    <rect width="1200" height="320" fill="url(#grid)"/>
    <ellipse cx="190" cy="30" rx="420" ry="230" fill="url(#glowA)"/>
    <ellipse cx="1050" cy="310" rx="430" ry="250" fill="url(#glowB)"/>

    <g fill="#dbeafe">
      <circle cx="90" cy="0" r="1.6" opacity="0.45"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="11s" begin="-3s" repeatCount="indefinite"/></circle>
      <circle cx="168" cy="0" r="2.2" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="8.5s" begin="-6.5s" repeatCount="indefinite"/></circle>
      <circle cx="252" cy="0" r="1.3" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="13s" begin="-1s" repeatCount="indefinite"/></circle>
      <circle cx="338" cy="0" r="1.9" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="9.5s" begin="-8s" repeatCount="indefinite"/></circle>
      <circle cx="424" cy="0" r="1.4" opacity="0.38"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="12s" begin="-4.5s" repeatCount="indefinite"/></circle>
      <circle cx="512" cy="0" r="2" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="10.5s" begin="-9s" repeatCount="indefinite"/></circle>
      <circle cx="596" cy="0" r="1.2" opacity="0.35"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="14s" begin="-2.5s" repeatCount="indefinite"/></circle>
      <circle cx="684" cy="0" r="1.8" opacity="0.48"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="9s" begin="-7s" repeatCount="indefinite"/></circle>
      <circle cx="772" cy="0" r="1.5" opacity="0.42"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="12.5s" begin="-5.5s" repeatCount="indefinite"/></circle>
      <circle cx="858" cy="0" r="2.1" opacity="0.55"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="8s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle cx="944" cy="0" r="1.3" opacity="0.36"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="13.5s" begin="-10s" repeatCount="indefinite"/></circle>
      <circle cx="1032" cy="0" r="1.9" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="10s" begin="-6s" repeatCount="indefinite"/></circle>
      <circle cx="1112" cy="0" r="1.4" opacity="0.4"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="11.5s" begin="-3.5s" repeatCount="indefinite"/></circle>
      <circle cx="1168" cy="0" r="1.7" opacity="0.46"><animateTransform attributeName="transform" type="translate" values="0 -40;0 350" dur="9.8s" begin="-8.5s" repeatCount="indefinite"/></circle>
