name: Plugin CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Check release shell syntax
        run: bash -n scripts/market-pr.sh
      - name: Validate plugin manifests, resources and syntax
        run: python scripts/release.py validate
      - name: Verify the TypeScript entry matches its sources
        working-directory: plugins/prompt-optimizer
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Verify the session-file-count entry matches its sources
        working-directory: plugins/session-file-count
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Verify the external-tool-renderer entry matches its sources
        working-directory: plugins/external-tool-renderer
        run: |
          npm ci --no-audit --no-fund
          npm run check
