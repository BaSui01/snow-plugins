name: 故障报告
description: 提供插件和宿主版本、复现步骤及脱敏日志。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先阅读贡献指南和 SECURITY.md。不要公开密钥、Token、Cookie、私钥、业务数据或敏感路径。
        安全问题请先撤销泄露凭据，再通过 GitHub 已可用私密渠道联系；若无私密渠道，不公开细节。
        Snow App v0.4.16 支持基础功能，但 footer 没有 write，点击打开文件不受支持。
  - type: input
    id: plugin
    attributes:
      label: 插件名称或 ID
      description: 请明确受影响插件。
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本与安装来源
      description: 填写清单版本、Release 标签或源码提交，以及目录安装或市场安装。
    validations:
      required: true
  - type: input
    id: host-version
    attributes:
      label: Snow App 版本或构建
      description: 填写实际宿主版本；自定义构建请提供非敏感构建标识，勿仅写最新版。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 操作系统及与问题相关的主题、语言、安装方式等。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 最小复现步骤
      description: 按顺序描述操作、前置条件和复现频率，不使用真实秘密或业务数据。
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期与实际结果
      description: 区分能力缺失、错误提示和异常行为。
    validations:
      required: true
  - type: textarea
    id: sanitized-logs
    attributes:
      label: 脱敏日志或截图
      description: 仅提供必要片段，移除认证头、凭据、会话正文及敏感路径；无日志时请说明。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开报告确认
      options:
        - label: 我已脱敏资料，不在此公开安全敏感细节或有效凭据。
          required: true
